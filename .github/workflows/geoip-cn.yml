name: Build geoip-cn rule-set

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download China IPv4 list
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/jackszb/rules-build/main/china_ip_list.txt \
            -o china_ip_list.txt

      - name: Normalize IPv4 list (dedupe + numeric sort)
        run: |
          sed '/^\s*$/d' china_ip_list.txt | sort -Vu > ip.txt

      - name: Generate geoip-cn.json (jq)
        run: |
          jq -Rn '
            [inputs] |
            {
              version: 3,
              rules: [
                {
                  ip_cidr: .
                }
              ]
            }
          ' ip.txt > geoip-cn.json

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh

      - name: Compile geoip-cn.srs
        run: |
          sing-box rule-set compile geoip-cn.json

      - name: Commit & Push
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git add geoip-cn.json geoip-cn.srs
          git commit -m "Auto update geoip-cn rule-set" || echo "No changes"
          git push
